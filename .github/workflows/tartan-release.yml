name: Tartan release

# Tartan Studios builds an unchanged upstream tag for every platform Rokit
# installs on, including Linux arm64, which upstream does not publish
# (TAR-2656). TARTAN.md says how to release one.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The upstream tag to build and release, such as v0.3.2.
        required: true
        type: string
      dry-run:
        description: Build and package every zip, and publish nothing.
        required: false
        type: boolean
        default: false
  pull_request:

permissions:
  contents: read

concurrency:
  group: tartan-release-${{ github.event_name }}-${{ github.ref }}-${{ inputs.tag }}-${{ inputs.dry-run }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TOOL: wally
  PACKAGE: wally
  RUST_TOOLCHAIN: "1.70.0"
  TAG: ${{ inputs.tag || 'v0.3.2' }}
  DRY_RUN: ${{ github.event_name == 'pull_request' || inputs.dry-run }}

jobs:
  check:
    name: Check the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Match the tag to the package version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          number='(0|[1-9][0-9]*)'
          if ! [[ "$TAG" =~ ^v?$number\.$number\.$number$ ]]; then
            echo "::error::Upstream release tags are X.Y.Z or vX.Y.Z, not $TAG."
            exit 1
          fi
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          version="$(cargo "+$RUST_TOOLCHAIN" metadata --no-deps --format-version 1 |
            jq -er --arg package "$PACKAGE" '.packages[] | select(.name == $package) | .version')"
          if [[ "$version" != "${TAG#v}" ]]; then
            echo "::error::$PACKAGE is version $version at $TAG."
            exit 1
          fi
          if [[ "$DRY_RUN" != true ]] && gh release view "$TAG" --repo "$REPOSITORY" > /dev/null 2>&1; then
            echo "::error::$TAG is already released."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.os }} ${{ matrix.arch }}
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: linux, arch: x86_64, runner: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: linux, arch: aarch64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos, arch: aarch64, runner: macos-15, target: aarch64-apple-darwin }
          - { os: windows, arch: x86_64, runner: windows-2022, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ needs.check.outputs.commit }}
          persist-credentials: false

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
          OS: ${{ matrix.os }}
        run: |
          set -euo pipefail
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target "$TARGET"
          if [[ "$OS" == macos ]]; then
            export OPENSSL_STATIC=1
          fi
          cargo "+$RUST_TOOLCHAIN" build --release --locked --package "$PACKAGE" --bin "$TOOL" --target "$TARGET"

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
          VERSION: ${{ needs.check.outputs.version }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          executable="$TOOL"
          [[ "$OS" == windows ]] && executable="$TOOL.exe"
          staging="$RUNNER_TEMP/staging"
          mkdir -p "$staging" "$RUNNER_TEMP/dist"
          cp "target/$TARGET/release/$executable" "$staging/"
          if [[ "$OS" == macos ]]; then
            otool -L "$staging/$executable"
            if otool -L "$staging/$executable" | tail -n +2 | grep -Ev '^[[:space:]]+(/usr/lib/|/System/)'; then
              echo "::error::$executable links a library outside macOS itself, which most Macs lack."
              exit 1
            fi
          fi
          shopt -s nullglob nocaseglob
          licences=(LICENSE* LICENCE* COPYING* NOTICE*)
          shopt -u nullglob nocaseglob
          cp -R "${licences[@]}" "$staging/"
          asset="$RUNNER_TEMP/dist/$TOOL-$VERSION-$OS-$ARCH.zip"
          cd "$staging"
          if [[ "$OS" == windows ]]; then
            7z a -tzip -bso0 "$(cygpath -w "$asset")" "$executable" "${licences[@]}"
          else
            zip -q -X "$asset" "$executable" "${licences[@]}"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: dist-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: [check, build]
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry-run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.check.outputs.version }}
          COMMIT: ${{ needs.check.outputs.commit }}
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd dist
          for zip in ./*.zip; do
            sha256sum "${zip#./}" > "$zip.sha256"
          done
          notes="Upstream $TOOL $TAG, commit $COMMIT, unchanged, built with Rust $RUST_TOOLCHAIN by"
          notes+=" .github/workflows/tartan-release.yml at $WORKFLOW_COMMIT for Linux arm64 and x86_64, macOS arm64"
          notes+=" and Windows x86_64."
          gh release create "$TAG" ./* --repo "$REPOSITORY" --verify-tag --title "$TOOL $VERSION" --notes "$notes"
